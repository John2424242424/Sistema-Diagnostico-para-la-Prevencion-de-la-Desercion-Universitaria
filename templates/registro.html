<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Orientación Vocacional</title>
    <style>
        /* Estilos generales (consistentes con login) */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .register-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 400px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .avatar-section {
            margin: 20px 0;
        }

        .avatar-options {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }

        .avatar-option {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #ddd;
            cursor: pointer;
        }

        .avatar-option.selected {
            border-color: #3498db;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2980b9;
        }

        .login-link {
            margin-top: 15px;
            color: #7f8c8d;
            font-size: 14px;
        }

        .login-link a {
            color: #3498db;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>Registro</h1>
        <form>
            <div class="input-group">
                <label for="name">Nombre y Apellido</label>
                <input type="text" id="name" placeholder="Ingrese su nombre y apellido" required>
            </div>
            <div class="input-group">
                <label for="id">Cédula</label>
                <input type="text" id="id" placeholder="Ingrese su cédula" required>
            </div>
            <div class="input-group">
                <label for="stratum">Estrato</label>
                <input type="number" id="stratum" placeholder="Ingrese su estrato" min="1" max="6" required>
            </div>
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="Ingrese su correo electrónico" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingrese una contraseña" required>
            </div>
            <div class="input-group">
                <label for="confirm-password">Repita su contraseña</label>
                <input type="password" id="confirm-password" placeholder="Repita su contraseña" required>
            </div>

            <div class="avatar-section">
                <label>Personalice su avatar</label>
                <div class="avatar-options">
                    <div class="avatar-option selected" style="background-color: #ffcc80;"></div>
                    <div class="avatar-option" style="background-color: #80deea;"></div>
                    <div class="avatar-option" style="background-color: #ce93d8;"></div>
                </div>
            </div>

            <button type="submit">Registrarse</button>
        </form>
        <div class="login-link">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </div>
    </div>

    <script>
        // Selección de avatar
        const avatars = document.querySelectorAll('.avatar-option');
        avatars.forEach(avatar => {
            avatar.addEventListener('click', () => {
                avatars.forEach(a => a.classList.remove('selected'));
                avatar.classList.add('selected');
            });
        });
    </script>
</body>
</html>
